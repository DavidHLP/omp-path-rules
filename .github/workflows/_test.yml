# Reusable: Unit & Regression Tests Matrix
name: Test Suite

on:
  workflow_call:
    inputs:
      matrix_os:
        description: 'Test on multi-OS matrix (Ubuntu + macOS)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Bun Unit & Regression Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.matrix_os && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (pinned)
        with:
          # Pin the runtime version so upstream bun releases cannot change
          # test semantics overnight. Bump deliberately, not passively.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite (bun test)
        run: bun test
