# Reusable: Unit & Regression Tests Matrix
name: Test Suite

on:
  workflow_call:
    inputs:
      matrix_os:
        description: 'Test on multi-OS matrix (Ubuntu + macOS)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Bun Unit & Regression Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.matrix_os && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite (bun test)
        run: bun test
