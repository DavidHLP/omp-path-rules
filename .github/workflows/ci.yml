# CI pipeline structured after codebase-memory-mcp architectural pattern:
# 1. Modular reusable sub-workflows (_lint, _security, _test, _e2e)
# 2. Concurrency groups to cancel superseded in-flight jobs
# 3. Aggregated gate check (`ci-ok`) providing a single stable branch protection context.
#    NOTE: ci-ok treats "skipped" as failure by default (see scripts/ci/require-all-green.sh),
#    so no stage can be silently skipped while the gate stays green.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Lint & Strict Typecheck ───────────────────────────────────────
  lint:
    name: lint
    uses: ./.github/workflows/_lint.yml

  # ── Stage 2: Security Audit ────────────────────────────────────────────────
  security:
    name: security
    uses: ./.github/workflows/_security.yml

  # ── Stage 3: Unit & Regression Tests (Multi-OS Matrix) ─────────────────────
  test:
    name: test
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix_os: true

  # ── Stage 4: E2E Verification (Simulated + Loader + Real CLI) ──────────────
  e2e:
    name: e2e
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml

  # ── Stage 5: Aggregate Status Gate (ci-ok) ──────────────────────────────────
  ci-ok:
    name: ci-ok
    needs: [lint, security, test, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: All Pipeline Stages Must Have Succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: ./scripts/ci/require-all-green.sh
