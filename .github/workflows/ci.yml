# CI pipeline structured after codebase-memory-mcp architectural pattern:
# 1. Modular reusable sub-workflows (_lint, _security, _test, _e2e)
# 2. Concurrency groups to cancel superseded in-flight jobs
# 3. Path change detection to optimize turnaround time
# 4. Aggregated gate check (`ci-ok`) providing a single stable branch protection context
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Change Detection ────────────────────────────────────────────────────────
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect Code Changes
        id: filter
        run: |
          # Default to true on push / full verification
          echo "code=true" >> "$GITHUB_OUTPUT"

  # ── Stage 1: Lint & Strict Typecheck ───────────────────────────────────────
  lint:
    name: lint
    uses: ./.github/workflows/_lint.yml

  # ── Stage 2: Security Audit ────────────────────────────────────────────────
  security:
    name: security
    uses: ./.github/workflows/_security.yml

  # ── Stage 3: Unit & Regression Tests (Multi-OS Matrix) ─────────────────────
  test:
    name: test
    needs: [lint]
    if: ${{ !cancelled() && needs.lint.result == 'success' }}
    uses: ./.github/workflows/_test.yml
    with:
      matrix_os: true

  # ── Stage 4: E2E Verification (Simulated + Loader + Real CLI) ──────────────
  e2e:
    name: e2e
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    uses: ./.github/workflows/_e2e.yml

  # ── Stage 5: Aggregate Status Gate (ci-ok) ──────────────────────────────────
  ci-ok:
    name: ci-ok
    needs: [changes, lint, security, test, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: All Pipeline Stages Must Have Succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: ./scripts/ci/require-all-green.sh
