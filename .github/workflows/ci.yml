name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

  test:
    name: Unit & Regression Tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun test

  integration-e2e:
    name: Simulated OMP Runtime E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E Integration Scenario
        run: |
          bun -e '
            import * as fs from "node:fs/promises";
            import * as path from "node:path";
            import ompPathRules from "./src/index.js";

            const testCwd = "/tmp/omp-e2e-ci";
            await fs.mkdir(path.join(testCwd, ".omp", "rules"), { recursive: true });

            // 1. Create a path rule
            await fs.writeFile(
              path.join(testCwd, ".omp", "rules", "api-standards.md"),
              "---\nglobs: [\"src/api/**/*.ts\"]\npriority: 100\n---\n# API Rules\nAlways validate with Zod."
            );

            // 2. Create a TTSR rule (should be skipped)
            await fs.writeFile(
              path.join(testCwd, ".omp", "rules", "no-eval.md"),
              "---\ncondition: \"eval\\\\(\"\nscope: \"tool:edit(*.ts)\"\n---\nNever use eval."
            );

            let contextHandler;
            const mockPi = {
              setLabel(l) { console.log("Registered extension:", l); },
              on(event, handler) {
                if (event === "context") contextHandler = handler;
              },
              registerCommand() {},
              logger: { debug: console.log, info: console.log, warn: console.warn, error: console.error }
            };

            ompPathRules(mockPi);

            if (!contextHandler) {
              throw new Error("Context handler was not registered");
            }

            // Simulate turn 1 (touching src/api/users.ts)
            const res1 = await contextHandler({
              messages: [
                {
                  role: "user",
                  content: [{ type: "text", text: "Please update src/api/users.ts" }]
                }
              ]
            }, {
              cwd: testCwd,
              ui: { setStatus: (k, v) => console.log("Status update:", k, v) }
            });

            console.log("Turn 1 Injected Messages count:", res1.messages.length);
            const injectedContent = res1.messages[0].content;
            if (!injectedContent.includes("Always validate with Zod.")) {
              throw new Error("Expected api-standards rule to be injected");
            }
            if (injectedContent.includes("Never use eval.")) {
              throw new Error("TTSR rule was incorrectly injected into prompt context");
            }

            // Simulate turn 2 (moving away from src/api to docs/readme.md -> rule should be evicted)
            const res2 = await contextHandler({
              messages: [
                ...res1.messages,
                { role: "assistant", content: "Done editing users." },
                {
                  role: "user",
                  content: [{ type: "text", text: "Now look at docs/readme.md" }]
                }
              ]
            }, {
              cwd: testCwd,
              ui: { setStatus: () => {} }
            });

            console.log("Turn 2 Messages count:", res2.messages.length);
            const hasRuleInTurn2 = res2.messages.some(m => typeof m.content === "string" && m.content.includes("Always validate with Zod."));
            if (hasRuleInTurn2) {
              throw new Error("Single-turn transient eviction failed: rule remained in context");
            }

            console.log("All E2E checks passed successfully in CI environment!");
          '
