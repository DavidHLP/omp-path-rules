# Reusable: Lint & TypeScript Strict Typecheck
name: Lint & Typecheck

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (pinned)
        with:
          # Pin the runtime version so upstream bun releases cannot change
          # test semantics overnight. Bump deliberately, not passively.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck (tsc --noEmit)
        run: bun run typecheck
