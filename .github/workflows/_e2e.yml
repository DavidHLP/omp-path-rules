# Reusable: End-to-End OMP Integration & Context Injection Pipeline
name: E2E Verification

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  simulated-context:
    name: Simulated Context Lifecycle E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Context Simulation Scenario
        run: |
          bun -e '
            import * as fs from "node:fs/promises";
            import * as path from "node:path";
            import ompPathRules from "./src/index.js";

            const testCwd = "/tmp/omp-e2e-ci";
            await fs.mkdir(path.join(testCwd, ".omp", "rules"), { recursive: true });

            // 1. Create a standard path rule (should be injected when path matches)
            await fs.writeFile(
              path.join(testCwd, ".omp", "rules", "api-standards.md"),
              "---\nglobs: [\"src/api/**/*.ts\"]\npriority: 100\n---\n# API Rules\nAlways validate with Zod."
            );

            // 2. Create a TTSR rule with regex condition + scope (must NOT be injected into prompt context)
            await fs.writeFile(
              path.join(testCwd, ".omp", "rules", "no-eval.md"),
              "---\ncondition: \"eval\\\\(\"\nscope: \"tool:edit(*.ts)\"\n---\nNever use eval."
            );

            let contextHandler;
            const mockPi = {
              setLabel(l) { console.log("Registered extension:", l); },
              on(event, handler) {
                if (event === "context") contextHandler = handler;
              },
              registerCommand() {},
              logger: { debug: console.log, info: console.log, warn: console.warn, error: console.error }
            };

            ompPathRules(mockPi);

            if (!contextHandler) {
              throw new Error("Context handler was not registered");
            }

            // Simulate turn 1 (touching src/api/users.ts)
            const res1 = await contextHandler({
              messages: [
                {
                  role: "user",
                  content: [{ type: "text", text: "Please update src/api/users.ts" }]
                }
              ]
            }, {
              cwd: testCwd,
              ui: { setStatus: (k, v) => console.log("Status update:", k, v) }
            });

            console.log("Turn 1 Injected Messages count:", res1.messages.length);
            const injectedContent = JSON.stringify(res1.messages[0].content);
            if (!injectedContent.includes("Always validate with Zod.")) {
              throw new Error("Expected api-standards rule to be injected");
            }
            if (injectedContent.includes("Never use eval.")) {
              throw new Error("TTSR rule was incorrectly injected into prompt context");
            }

            // Simulate turn 2 (moving away from src/api to docs/readme.md -> rule should be evicted)
            const res2 = await contextHandler({
              messages: [
                ...res1.messages,
                { role: "assistant", content: [{ type: "text", text: "Done editing users." }] },
                {
                  role: "user",
                  content: [{ type: "text", text: "Now look at docs/readme.md" }]
                }
              ]
            }, {
              cwd: testCwd,
              ui: { setStatus: () => {} }
            });

            console.log("Turn 2 Messages count:", res2.messages.length);
            const hasRuleInTurn2 = res2.messages.some(m => JSON.stringify(m.content).includes("Always validate with Zod."));
            if (hasRuleInTurn2) {
              throw new Error("Single-turn transient eviction failed: rule remained in context");
            }

            console.log("All context lifecycle checks passed successfully!");
          '

  official-loader:
    name: Official OMP Extension Loader E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Execute Official OMP Loader Verification
        run: |
          bun -e '
            import * as path from "node:path";
            import { loadExtensions } from "@oh-my-pi/pi-coding-agent/extensibility/extensions";

            const extensionEntry = path.resolve("src/index.ts");
            const result = await loadExtensions([extensionEntry], process.cwd());

            console.log("Loader errors count:", result.errors.length);
            if (result.errors.length > 0) {
              console.error("Loader errors:", result.errors);
              throw new Error("Official OMP extension loader encountered errors loading src/index.ts");
            }

            if (result.extensions.length !== 1) {
              throw new Error(`Expected exactly 1 extension, got ${result.extensions.length}`);
            }

            const loaded = result.extensions[0];
            console.log("Loaded extension label:", loaded.label);
            console.log("Loaded extension resolvedPath:", loaded.resolvedPath);
            if (loaded.label !== "omp-path-rules") {
              throw new Error(`Expected label omp-path-rules, got ${loaded.label}`);
            }
            if (loaded.resolvedPath !== extensionEntry) {
              throw new Error(`Expected resolvedPath ${extensionEntry}, got ${loaded.resolvedPath}`);
            }

            console.log("✓ Official OMP extension loader successfully initialized omp-path-rules without errors!");
          '

  real-omp-cli:
    name: Real OMP CLI Context Injection E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install official OMP CLI binary
        run: npm install -g @oh-my-pi/pi-coding-agent@18.0.0

      - name: Verify OMP CLI version
        run: |
          which omp
          omp --version

      - name: Execute Real OMP CLI E2E Context Injection Test
        run: bun run test/e2e-omp-runner.ts
